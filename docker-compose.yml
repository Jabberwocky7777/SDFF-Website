services:
  sdff-web:
    image: ghcr.io/jabberwocky7777/sdff-website:latest
    ports:
      - "7780:3001"    # host:container — server always listens on 3001 inside the container
    volumes:
      - /mnt/pool/sdff-cache:/app/cache   # adjust to your TrueNAS dataset path
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
