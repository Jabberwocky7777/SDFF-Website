# For a hand-run "docker compose". On TrueNAS Scale, use the Custom App form
# instead (see README) — you don't need this file there.
services:
  sdff-web:
    image: ghcr.io/jabberwocky7777/sdff-website:latest
    ports:
      - "7780:3001"
    environment:
      TZ: America/New_York
    volumes:
      - sdff-data:/app/cache
    restart: unless-stopped

volumes:
  sdff-data: {}
