name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      # better-sqlite3 is a native module; if no prebuild matches it compiles
      # here, which is exactly the failure worth catching before the image build.
      - run: npm ci

      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build:all
      - run: npm test
